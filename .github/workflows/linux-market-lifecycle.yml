name: Linux Asset Market lifecycle

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scenario:
        description: Lifecycle scenario to run
        required: true
        default: all
        type: choice
        options: [all, ordinary, archive-warmed, combined-read]

permissions:
  contents: read

jobs:
  cgroup-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON((inputs.scenario == '' || inputs.scenario == 'all') && '["ordinary","archive-warmed","combined-read"]' || format('["{0}"]', inputs.scenario)) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build production-equivalent image
        # Both official registries serve this same immutable amd64 image.
        # A registry outage cannot change the image or waive a lifecycle gate.
        run: |
          pinned_digest=sha256:97983fa8cc88343512862c62307159a82261c3528dc025f79e5a3f7af43e50b4
          base_image=public.ecr.aws/docker/library/python@$pinned_digest
          if ! docker pull "$base_image"; then
            base_image=docker.io/library/python@$pinned_digest
            docker pull "$base_image"
          fi
          docker build --file tools/validation/Dockerfile.market-cgroup \
            --build-arg PYTHON_BASE_IMAGE="$base_image" \
            --tag dtos-market-cgroup:validation .
      - name: Guarded recovery lifecycle on Linux
        if: matrix.scenario == 'ordinary'
        run: |
          docker run --rm --memory 2g --memory-swap 2g --cpus 2 \
            --env DTOS_DISPOSABLE_RECOVERY_TEST=1 \
            dtos-market-cgroup:validation \
            sh -c 'python -m tools.validation.recovery_quiescence_linux && python -m unittest tests.test_retained_storage_recovery tests.test_retained_projection_recovery tests.test_storage_command_imports tests.test_storage_maintenance tests.test_projection_root_transition tests.test_projection_quarantine tests.test_projection_provenance_retention tests.test_fois_process_execution tests.test_fois_preparation_cleanup'
      - name: Run 2 GiB cgroup lifecycle
        run: |
          mkdir -p .validation/linux-market-${{ matrix.scenario }}
          mkdir -p .validation/fixture-${{ matrix.scenario }}
          docker run --rm \
            --memory 2g \
            --memory-swap 2g \
            --cpus 2 \
            --volume "$PWD/.validation/linux-market-${{ matrix.scenario }}:/output" \
            --volume "$PWD/.validation/fixture-${{ matrix.scenario }}:/fixture" \
            --env DTOS_BENCHMARK_OUTPUT=/output/summary.json \
            --env DTOS_ARCHIVE_WARMED=${{ matrix.scenario == 'archive-warmed' && '1' || '0' }} \
            --env DTOS_COMBINED_READ=${{ matrix.scenario == 'combined-read' && '1' || '0' }} \
            --env DTOS_PRODUCTION_SHAPED_FIXTURE=${{ matrix.scenario != 'ordinary' && '1' || '0' }} \
            --env DTOS_CACHE_FILE=/fixture/dtos_cache.json \
            --env DTOS_HISTORY_DB_FILE=/fixture/dtos_history.sqlite3 \
            --env DTOS_VALIDATION_LEGACY_ARCHIVE_FILE=/fixture/retirement-rehearsal.sqlite3 \
            --env DTOS_METADATA_DB_FILE=/fixture/dtos_metadata.sqlite3 \
            --env DTOS_HISTORY_STORAGE_ROOT=/fixture \
            --env DTOS_BACKGROUND_START_DELAY=0 \
            --env SLEEPER_LEAGUE_ID=1804000000000000000 \
            dtos-market-cgroup:validation \
            sh -c 'python -m tools.validation.generate_sanitized_market_fixture && python -m tools.validation.linux_market_cgroup_gate'
      - name: Verify sanitized result
        if: always()
        run: |
          test -f .validation/linux-market-${{ matrix.scenario }}/summary.json
          python -c "import json, pathlib; p=json.loads(pathlib.Path('.validation/linux-market-${{ matrix.scenario }}/summary.json').read_text()); assert p.get('completed') is True and p.get('passed') is True and p.get('exit_code') == 0"
      - name: Upload sanitized benchmark summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-market-lifecycle-${{ matrix.scenario }}-summary
          path: |
            .validation/linux-market-${{ matrix.scenario }}/summary.json
            .validation/linux-market-${{ matrix.scenario }}/server.log
          if-no-files-found: error
          retention-days: 14
