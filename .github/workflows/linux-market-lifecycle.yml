name: Final bounded memory recovery audit
on:
  workflow_dispatch:
    inputs:
      init:
        description: Use Docker init to reap orphaned validation helpers
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned production-compatible Python image
        run: |
          pinned_digest=sha256:97983fa8cc88343512862c62307159a82261c3528dc025f79e5a3f7af43e50b4
          base_image=public.ecr.aws/docker/library/python@$pinned_digest
          if ! docker pull "$base_image"; then
            base_image=docker.io/library/python@$pinned_digest
            docker pull "$base_image"
          fi
          docker build -f tools/validation/Dockerfile.market-cgroup --build-arg PYTHON_BASE_IMAGE="$base_image" -t dtos-final-memory .
      - name: Prepare fixture in a separate container
        run: |
          mkdir -p .validation/final-fixture .validation/final-output .validation/audit
          docker run --rm --init --network none --memory 2g --memory-swap 2g --cpus 2 \
            -v "$PWD/.validation/final-fixture:/fixture" \
            -e DTOS_CACHE_FILE=/fixture/dtos_cache.json \
            -e DTOS_HISTORY_STORAGE_ROOT=/fixture \
            -e DTOS_HISTORY_DB_FILE=/fixture/dtos_history.sqlite3 \
            -e DTOS_METADATA_DB_FILE=/fixture/dtos_metadata.sqlite3 \
            dtos-final-memory python -m tools.validation.generate_sanitized_market_fixture 2>&1 | tee .validation/final-output/fixture.log
      - name: Install bounded diagnostic observers
        run: |
          cat > .validation/audit/server.py <<'PY'
          """Disposable transport substitution only; production routes/lifespan/ownership."""
          import asyncio,json,time,os
          from pathlib import Path
          import dtos_app as d
          from fastapi import Request
          from src.core.projection_intelligence.service import ProjectionService
          from src.platform.lifecycle import lifecycle_coordinator
          from src.core.history_context import canonical_history_store
          from services.history import _SEASON_SECTION_CACHE
          
          async def cached_maintenance(epoch):
              lifecycle_coordinator.complete_startup(epoch,'Disposable cached-source fixture; live sync intentionally not exercised.')
              await asyncio.Event().wait()
          d.startup_and_periodic_maintenance=cached_maintenance
          async def hydrate(runtime):
              data=json.loads(Path(os.environ['DTOS_CACHE_FILE']).read_text())['data']
              data['league']['league_id']=runtime.league_id
              data['league']['name']='Disposable League '+runtime.league_id[-3:]
              await runtime.publish_source(data)
              projections=ProjectionService(league_id=runtime.league_id,scoring_profile_id=runtime.scoring_profile)
              projections.restore_into(data)
              d._publish_runtime_context(runtime,projections)
              canonical_history_store.update_current(runtime.league_id,data)
              return data
          d.league_runtime_manager._hydrator=hydrate
          @d.app.get('/__audit__/state')
          async def state(request:Request):
              from src.core.fois import process_execution as f
              from src.core.fois.history_execution import history_requests
              from src.core.intelligence.cache import intelligence_cache
              r=d.league_runtime_manager
              return {'runtime':r.health(),'runtime_refs':[{'league':x.league_id,'active':x.active_requests,'tasks':len(x.background_tasks),'has_data':bool(x.state.get('data')),'market':x.market_context.metrics() if x.market_context else None} for x in r.resident_runtimes()], 'history_current':len(canonical_history_store._current),'season_cache_sections':len(_SEASON_SECTION_CACHE),'fois_in_flight':f._IN_FLIGHT,'fois_executor':f._EXECUTOR is not None,'history_admitted':history_requests.active_count,'lifecycle':lifecycle_coordinator.snapshot()}
          app=d.app
          PY
          cat > .validation/audit/probe.py <<'PY'
          import os,sys,time,json,threading,subprocess,hashlib,signal,unittest,gc
          from pathlib import Path
          import psutil
          OUT=Path('/output');OUT.mkdir(exist_ok=True);start=time.monotonic();phase='launch';halt=threading.Event();lock=threading.Lock();known={}
          def append(name,row):
              with lock:
                  with open(OUT/name,'a') as f:f.write(json.dumps(row,separators=(',',':'),default=str)+'\n')
          def sample(label=None):
              begin=time.monotonic();row={'wall':time.time(),'elapsed':begin-start,'phase':label or phase,'processes':[],'padding_bytes':0}
              for name in ('memory.current','memory.peak','memory.max','memory.events','memory.stat'):
                  with open('/sys/fs/cgroup/'+name) as f:row[name]=f.read()
              for p in psutil.process_iter(['pid','ppid','name','status','create_time']):
                  try:
                      m=p.memory_full_info();info=p.info;key=str(p.pid)+':'+str(info['create_time'])
                      if key not in known:
                          argv=p.cmdline();role='other'
                          for word in ('resource_tracker','spawn_main','uvicorn','worker_checks.py','probe.py','docker-init'):
                              if any(word in a for a in argv):role=word;break
                          known[key]={'first_ppid':info['ppid'],'role':role,'first_elapsed':begin-start}
                      row['processes'].append({**info,**known[key],'rss':m.rss,'pss':getattr(m,'pss',None),'uss':getattr(m,'uss',None)})
                  except (psutil.Error,OSError):pass
              row['window_ms']=(time.monotonic()-begin)*1000;append('samples.jsonl',row);return row
          def event(name,**extra):
              global phase
              phase=name;append('events.jsonl',{'event':name,'wall':time.time(),'elapsed':time.monotonic()-start,**extra});sample(name)
          def watch():
              while not halt.wait(.5):sample()
          def request(path,token=None,expect=None):
              from urllib.request import urlopen,Request
              from urllib.error import HTTPError
              h={'Cookie':'dtos_session='+token} if token else {}
              t=time.monotonic()
              try:
                  with urlopen(Request('http://127.0.0.1:8767'+path,headers=h),timeout=60) as r:status,body=r.status,r.read();final_path=r.url.split('8767')[-1]
              except HTTPError as r:status,body=r.code,r.read();final_path=path
              row={'path':path,'authenticated':bool(token),'status':status,'ms':(time.monotonic()-t)*1000,'final_path':final_path,'bytes':len(body),'wall':time.time(),'phase':phase}
              append('http.jsonl',row)
              if expect is not None:assert status in expect,row
              return status,body,row
          
          def external_probe():
              while not halt.wait(.2):
                  if 'begin' not in phase and not phase.startswith('cold_'):continue
                  try:request('/health/live',expect=(200,))
                  except Exception as e:append('probe-errors.jsonl',{'type':type(e).__name__,'phase':phase,'wall':time.time()})
          
          def configure():
              names={'CACHE':'dtos_cache.json','ACCOUNT_DB':'accounts.sqlite3','FOIS_DB':'fois.sqlite3','HISTORY_DB':'dtos_history.sqlite3','PROJECTION_DB':'projections.sqlite3','METADATA_DB':'dtos_metadata.sqlite3','INTELLIGENCE_CHECKPOINT':'intel.sqlite3','GLOBAL_EVIDENCE':'global.sqlite3'}
              for k,v in names.items():os.environ['DTOS_'+k+'_FILE']='/fixture/'+v
              os.environ.update(DTOS_HISTORY_STORAGE_ROOT='/fixture',DTOS_SLEEPER_SEASON_CACHE_ROOT='/fixture/seasons',DTOS_DURABLE_HISTORY_REQUIRED='0',SLEEPER_LEAGUE_ID='1804000000000000000',DTOS_AUTH_REQUIRED='1',DTOS_MULTI_LEAGUE_IMPORT_ENABLED='1',DTOS_BACKGROUND_START_DELAY='3600',SLEEPER_BASE_URL='http://127.0.0.1:9/v1')
          
          def main():
              configure();assert int(Path('/sys/fs/cgroup/memory.max').read_text())==2147483648
              event('application_observation_container_start',python=sys.version,pid=os.getpid(),padding_bytes=0)
              thread=threading.Thread(target=watch,daemon=True);thread.start()
              from src.core.accounts import AccountService,AccountStore
              store=AccountStore('/fixture/accounts.sqlite3');service=AccountService(store);tokens=[]
              leagues=['1804000000000000000','200','300']
              for i,league in enumerate(leagues):
                  aid,_=service.create_account('audit'+str(i),'Disposable Manager','disposable audit password')
                  store.link_sleeper(aid,sleeper_user_id='owner'+str(i),username='fixture',display_name='Fixture')
                  store.upsert_membership(aid,{'league_id':league,'name':'Disposable '+str(i),'season':'2026'},'owner'+str(i),1,'Franchise '+str(i),'active');store.activate(aid,league);tokens.append(service.new_session(aid)[0])
              server=None;checks=None;results=[]
              try:
                  log=open(OUT/'server.log','w');server=subprocess.Popen([sys.executable,'-m','uvicorn','server:app','--host','127.0.0.1','--port','8767'],stdout=log,stderr=subprocess.STDOUT,env={**os.environ,'PYTHONPATH':'/audit:/app'},start_new_session=True)
                  event('server_created',pid=server.pid)
                  for _ in range(240):
                      if server.poll() is not None:raise RuntimeError('server exited '+str(server.returncode))
                      try:
                          request('/health/live',expect=(200,));break
                      except OSError:time.sleep(.25)
                  else:raise TimeoutError('startup')
                  threading.Thread(target=external_probe,daemon=True).start()
                  event('cold_authenticated_home_begin');request('/',tokens[0],(200,));event('cold_authenticated_home_complete')
                  # Warm up views explicitly; no arbitrary work is triggered by observer.
                  checkslog=open(OUT/'workers.log','w')
                  checks=subprocess.Popen([sys.executable,'/audit/worker_checks.py'],stdout=checkslog,stderr=subprocess.STDOUT,env={**os.environ,'PYTHONPATH':'/audit:/app'})
                  for cycle in range(6):
                      event('navigation_cycle_'+str(cycle)+'_begin')
                      for i in ((0,1,2) if cycle%2==0 else (2,1,0)):
                          for path in ('/','/league','/market','/trades','/account/my-dtos'):
                              request(path,tokens[i],(200,))
                          request('/welcome',expect=(200,));request('/health/live',expect=(200,))
                          _,body,_=request('/__audit__/state',tokens[i],(200,));append('states.jsonl',{'cycle':cycle,'league':leagues[i],'state':json.loads(body),'wall':time.time()})
                      event('navigation_cycle_'+str(cycle)+'_complete')
                      # No requests during this quiet interval. Sampling is external.
                      time.sleep(60)
                      event('navigation_cycle_'+str(cycle)+'_idle60')
                  # Concurrent supported lightweight reads, one per account, plus welcome.
                  from concurrent.futures import ThreadPoolExecutor
                  event('concurrent_reads_begin')
                  with ThreadPoolExecutor(max_workers=4) as pool:
                      futures=[pool.submit(request,'/',t,(200,)) for t in tokens]+[pool.submit(request,'/welcome',None,(200,))]
                      for f in futures:f.result()
                  event('concurrent_reads_complete')
                  checks.wait(timeout=300);event('worker_controls_complete',exit_code=checks.returncode);assert checks.returncode==0
                  event('extended_quiet_idle_begin');time.sleep(120);event('extended_quiet_idle120')
                  _,body,_=request('/__audit__/state',tokens[0],(200,));append('states.jsonl',{'stage':'after_quiet_idle','state':json.loads(body),'wall':time.time()})
                  event('idle_with_liveness_begin')
                  for _ in range(90):request('/health/live',expect=(200,));time.sleep(1)
                  event('idle_with_liveness90')
                  _,body,_=request('/__audit__/state',tokens[0],(200,));append('states.jsonl',{'stage':'after_liveness_idle','state':json.loads(body),'wall':time.time()})
                  event('server_shutdown_begin');server.send_signal(signal.SIGTERM);code=server.wait(timeout=30);event('server_reaped',pid=server.pid,exit_code=code);assert code==0
                  time.sleep(10);event('post_shutdown10')
                  # Record adopted exited children before collecting; diagnostic PID1 only.
                  collected=[]
                  if os.getpid()==1:
                      while True:
                          try:
                              pid,status=os.waitpid(-1,os.WNOHANG)
                              if not pid:break
                              collected.append({'pid':pid,'wait_status':status})
                          except ChildProcessError:break
                  event('observer_adopted_reap',collected=collected)
                  time.sleep(5);event('finished');return 0
              finally:
                  for p in (checks,server):
                      if p is not None and p.poll() is None:p.terminate();p.wait(timeout=30)
                  halt.set();thread.join(5)
          if __name__=='__main__':raise SystemExit(main())
          PY
          cat > .validation/audit/worker_checks.py <<'PY'
          import os,time,json,unittest,gc,sys
          from pathlib import Path
          # Entry guard is essential for multiprocessing spawn.
          def main():
              modules=['tests.test_league_runtime','tests.test_navigation_residency','tests.test_fois_process_execution','tests.test_fois_preparation_cleanup','tests.test_fois_history_execution','tests.test_public_entry']
              results=[]
              for i in range(6):
                  start=time.time();suite=unittest.defaultTestLoader.loadTestsFromNames(modules)
                  r=unittest.TextTestRunner(verbosity=2).run(suite)
                  results.append({'cycle':i,'start':start,'end':time.time(),'tests':r.testsRun,'failures':len(r.failures),'errors':len(r.errors),'skips':len(r.skipped),'passed':r.wasSuccessful()})
                  Path('/output/worker-results.json').write_text(json.dumps(results,indent=2));del suite,r;gc.collect()
                  if not results[-1]['passed']:return 1
                  time.sleep(60)
              return 0
          if __name__=='__main__':raise SystemExit(main())
          PY
      - name: Observe application and extended recovery under 2 GiB
        run: |
          init_option=""
          if [ "${{ inputs.init }}" = "true" ]; then init_option="--init"; fi
          docker run --rm $init_option --network none --memory 2g --memory-swap 2g --cpus 2 \
            -v "$PWD/.validation/final-fixture:/fixture" \
            -v "$PWD/.validation/final-output:/output" \
            -v "$PWD/.validation/audit:/audit:ro" \
            -e PYTHONPATH=/audit:/app \
            dtos-final-memory python /audit/probe.py 2>&1 | tee .validation/final-output/probe.log
      - name: Preserve original observations including unsuccessful runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-memory-init-${{ inputs.init }}
          path: .validation/final-output/*
          if-no-files-found: error
          retention-days: 30
