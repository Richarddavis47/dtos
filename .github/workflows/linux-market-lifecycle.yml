name: Linux Asset Market lifecycle

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scenario:
        description: Lifecycle scenario to run
        required: true
        default: all
        type: choice
        options: [all, ordinary, archive-warmed, combined-read, controls]

permissions:
  contents: read

jobs:
  cgroup-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON((inputs.scenario == '' || inputs.scenario == 'all') && '["ordinary","archive-warmed","combined-read"]' || format('["{0}"]', inputs.scenario)) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build production-equivalent image
        # Both official registries serve this same immutable amd64 image.
        # A registry outage cannot change the image or waive a lifecycle gate.
        run: |
          pinned_digest=sha256:97983fa8cc88343512862c62307159a82261c3528dc025f79e5a3f7af43e50b4
          base_image=public.ecr.aws/docker/library/python@$pinned_digest
          if ! docker pull "$base_image"; then
            base_image=docker.io/library/python@$pinned_digest
            docker pull "$base_image"
          fi
          docker build --file tools/validation/Dockerfile.market-cgroup \
            --build-arg PYTHON_BASE_IMAGE="$base_image" \
            --tag dtos-market-cgroup:validation .
      - name: Guarded recovery lifecycle on Linux
        if: matrix.scenario == 'ordinary'
        run: |
          docker run --rm --memory 2g --memory-swap 2g --cpus 2 \
            --env DTOS_DISPOSABLE_RECOVERY_TEST=1 \
            dtos-market-cgroup:validation \
            sh -c 'python -m tools.validation.recovery_quiescence_linux && python -m unittest tests.test_retained_storage_recovery tests.test_retained_projection_recovery tests.test_storage_command_imports tests.test_storage_maintenance tests.test_projection_root_transition tests.test_projection_quarantine tests.test_projection_provenance_retention tests.test_fois_process_execution tests.test_fois_preparation_cleanup'
      - name: Prepare bounded attribution observer
        run: |
          mkdir -p .validation/attribution
          cat > .validation/attribution/observer.py <<'PY'
          import os,sys,time,json,threading,subprocess,importlib
          from pathlib import Path
          import psutil
          OUT=Path('/output');OUT.mkdir(exist_ok=True);CG=Path('/sys/fs/cgroup');phase='observer_start';lock=threading.Lock();stop=threading.Event();samples=0

          def snap(label):
           global samples
           with lock:
            row={'wall':time.time(),'monotonic':time.monotonic(),'phase':label,'processes':[]};start=time.monotonic()
            for n in ['memory.current','memory.peak','memory.max','memory.events','memory.stat']:
             with open(CG/n) as f:row[n]=f.read()
            try:
             for p in [psutil.Process(),*psutil.Process().children(recursive=True)][:24]:
              try:
               m=p.memory_full_info();row['processes'].append({'pid':p.pid,'ppid':p.ppid(),'name':p.name(),'rss':m.rss,'pss':getattr(m,'pss',None),'uss':getattr(m,'uss',None),'status':p.status()})
              except psutil.Error:pass
            except psutil.Error:pass
            row['window_ms']=(time.monotonic()-start)*1000
            with (OUT/'attribution.jsonl').open('a') as f:f.write(json.dumps(row,separators=(',',':'))+'\n')
            samples+=1

          def event(label,**extra):
           global phase
           phase=label;snap(label)
           with (OUT/'boundaries.jsonl').open('a') as f:f.write(json.dumps({'wall':time.time(),'monotonic':time.monotonic(),'event':label,**extra})+'\n')

          def wrap(module,name):
           old=getattr(module,name)
           def call(*args,**kwargs):
            event(name+'_enter')
            try:
             result=old(*args,**kwargs)
             extra={'padding_bytes':sum(map(len,result))} if name=='_pad_to_production_baseline' else {}
             event(name+'_exit',**extra);return result
            except BaseException as e:event(name+'_error',error_type=type(e).__name__);raise
           setattr(module,name,call)

          def child(which):
           sys.path.insert(0,'/app')
           module=importlib.import_module('tools.validation.'+('generate_sanitized_market_fixture' if which=='generator' else 'linux_market_cgroup_gate'))
           for name in (['_production_history','_canonical_history_fixture'] if which=='generator' else ['_retire_validation_archive','_pad_to_production_baseline','_start_server','_stop_server']):wrap(module,name)
           event(which+'_entry');code=module.main();event(which+'_exit',code=code);return code

          def watch():
           while not stop.wait(.5):
            if samples>=4000:return
            snap(phase)

          def main():
           if len(sys.argv)>1:return child(sys.argv[1])
           assert int((CG/'memory.max').read_text())==2147483648
           event('before_generator');thread=threading.Thread(target=watch,daemon=True);thread.start()
           try:
            for which in ['generator','gate']:
             event('launch_'+which)
             with (OUT/(which+'-raw.log')).open('w') as f:
              code=subprocess.call([sys.executable,__file__,which],stdout=f,stderr=subprocess.STDOUT,timeout=900)
             event('after_'+which,code=code)
             if code:return code
            event('before_idle')
            for _ in range(10):time.sleep(.5);snap('idle_recovery')
            event('completed');return 0
           finally:stop.set();thread.join(3)
          if __name__=='__main__':raise SystemExit(main())
          PY
      - name: Bounded repeated cleanup and isolation controls
        if: matrix.scenario == 'controls'
        run: |
          set -o pipefail
          mkdir -p .validation/linux-market-controls .validation/controls-fixture
          cat > .validation/attribution/controls.py <<'PY'
          import sys,os,json,time,gc,unittest,threading
          from pathlib import Path
          sys.path[:0]=['/audit','/app']
          import observer as o
          def main():
           for key,name in {'CACHE':'cache.json','ACCOUNT_DB':'accounts.sqlite3','FOIS_DB':'fois.sqlite3','HISTORY_DB':'history.sqlite3','PROJECTION_DB':'projections.sqlite3','METADATA_DB':'metadata.sqlite3','INTELLIGENCE_CHECKPOINT':'intel.sqlite3'}.items():os.environ['DTOS_'+key+'_FILE']='/fixture/'+name
           os.environ.update(DTOS_HISTORY_STORAGE_ROOT='/fixture',DTOS_SLEEPER_SEASON_CACHE_ROOT='/fixture/seasons',DTOS_DURABLE_HISTORY_REQUIRED='0',SLEEPER_BASE_URL='http://127.0.0.1:9/v1')
           assert int(Path('/sys/fs/cgroup/memory.max').read_text())==2147483648
           o.event('controls_start');t=threading.Thread(target=o.watch,daemon=True);t.start();results=[]
           try:
            for i in range(3):
             o.event('controls_cycle_'+str(i)+'_before')
             suite=unittest.defaultTestLoader.loadTestsFromNames(['tests.test_league_runtime','tests.test_navigation_residency','tests.test_fois_process_execution','tests.test_fois_preparation_cleanup','tests.test_fois_history_execution','tests.test_public_entry'])
             r=unittest.TextTestRunner(verbosity=2).run(suite);results.append({'cycle':i,'tests':r.testsRun,'failures':len(r.failures),'errors':len(r.errors),'skips':len(r.skipped),'passed':r.wasSuccessful()});del suite,r;gc.collect();o.event('controls_cycle_'+str(i)+'_after')
             for n in range(6):time.sleep(.5);o.snap('controls_idle_'+str(i))
             if not results[-1]['passed']:break
           finally:o.stop.set();t.join(3)
           Path('/output/controls.json').write_text(json.dumps({'passed':all(r['passed'] for r in results) and len(results)==3,'results':results,'scope':'Disposable reduced fixtures; actual middleware/runtime and worker paths. Not production load or full-page multi-league traffic.'},indent=2))
           raise SystemExit(0 if all(r['passed'] for r in results) and len(results)==3 else 1)

          if __name__=='__main__':main()
          PY
          docker run --rm --init --network none --memory 2g --memory-swap 2g --cpus 2 \
            -v "$PWD/.validation/attribution:/audit:ro" \
            -v "$PWD/.validation/linux-market-controls:/output" \
            -v "$PWD/.validation/controls-fixture:/fixture" \
            dtos-market-cgroup:validation python /audit/controls.py 2>&1 | tee .validation/linux-market-controls/controls-raw.log
      - name: Run 2 GiB cgroup lifecycle
        if: matrix.scenario != 'controls'
        run: |
          mkdir -p .validation/linux-market-${{ matrix.scenario }}
          mkdir -p .validation/fixture-${{ matrix.scenario }}
          docker run --rm \
            --memory 2g \
            --memory-swap 2g \
            --cpus 2 \
            --volume "$PWD/.validation/attribution:/audit:ro" \
            --volume "$PWD/.validation/linux-market-${{ matrix.scenario }}:/output" \
            --volume "$PWD/.validation/fixture-${{ matrix.scenario }}:/fixture" \
            --env DTOS_BENCHMARK_OUTPUT=/output/summary.json \
            --env DTOS_ARCHIVE_WARMED=${{ matrix.scenario == 'archive-warmed' && '1' || '0' }} \
            --env DTOS_COMBINED_READ=${{ matrix.scenario == 'combined-read' && '1' || '0' }} \
            --env DTOS_PRODUCTION_SHAPED_FIXTURE=${{ matrix.scenario != 'ordinary' && '1' || '0' }} \
            --env DTOS_CACHE_FILE=/fixture/dtos_cache.json \
            --env DTOS_HISTORY_DB_FILE=/fixture/dtos_history.sqlite3 \
            --env DTOS_VALIDATION_LEGACY_ARCHIVE_FILE=/fixture/retirement-rehearsal.sqlite3 \
            --env DTOS_METADATA_DB_FILE=/fixture/dtos_metadata.sqlite3 \
            --env DTOS_HISTORY_STORAGE_ROOT=/fixture \
            --env DTOS_BACKGROUND_START_DELAY=0 \
            --env SLEEPER_LEAGUE_ID=1804000000000000000 \
            dtos-market-cgroup:validation \
            python /audit/observer.py
      - name: Authenticated navigation residency under 2 GiB
        if: matrix.scenario == 'ordinary'
        run: |
          mkdir -p .validation/navigation-residency-fixture
          docker run --rm --memory 2g --memory-swap 2g --cpus 2 \
            --volume "$PWD/.validation/navigation-residency-fixture:/fixture" \
            --volume "$PWD/.validation/linux-market-ordinary:/output" \
            dtos-market-cgroup:validation \
            python -m tools.validation.navigation_residency_probe \
              --fixture-root /fixture --output /output/navigation-residency.json
      - name: Verify sanitized result
        if: always() && matrix.scenario != 'controls'
        run: |
          test -f .validation/linux-market-${{ matrix.scenario }}/summary.json
          python -c "import json, pathlib; p=json.loads(pathlib.Path('.validation/linux-market-${{ matrix.scenario }}/summary.json').read_text()); assert p.get('completed') is True and p.get('passed') is True and p.get('exit_code') == 0"
      - name: Upload sanitized benchmark summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-market-lifecycle-${{ matrix.scenario }}-summary
          path: |
            .validation/linux-market-${{ matrix.scenario }}/*
            .validation/linux-market-${{ matrix.scenario }}/server.log
            .validation/linux-market-${{ matrix.scenario }}/navigation-residency.json
          if-no-files-found: error
          retention-days: 14
