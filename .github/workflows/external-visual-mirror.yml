name: External Visual Mirror

on:
  release:
    types: [published]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: external-visual-mirror
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      DTOS_BASE_URL: https://dtos.onrender.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if [[ -z "$tag" && "${{ github.event_name }}" == "release" ]]; then
            tag="${{ github.event.release.tag_name }}"
          fi
          if [[ -z "$tag" ]]; then
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -Fxq 'dtos-live-inspection-current.json'; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.release.outputs.published != 'true'
        with:
          python-version: "3.13"
      - name: Check out immutable release
        if: steps.release.outputs.published != 'true'
        run: git checkout "${{ steps.release.outputs.tag }}"
      - name: Install mirror dependency
        if: steps.release.outputs.published != 'true'
        run: python -m pip install "Pillow>=11,<13"
      - name: Wait for production, DINS, and Live Visual
        if: steps.release.outputs.published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mirror-assets
          for attempt in $(seq 1 60); do
            rm -rf mirror-assets/*
            set +e
            python -m tools.inspection.mirror \
              --base-url "$DTOS_BASE_URL" --output mirror-assets --require-dins
            result=$?
            set -e
            if [[ "$result" -eq 0 ]]; then
              exit 0
            fi
            if [[ "$result" -eq 3 ]]; then
              echo "External Visual Mirror authentication contract failed; refusing transient retries." >&2
              exit 1
            fi
            sleep 30
          done
          echo "External Visual Mirror did not become publishable within 30 minutes." >&2
          exit 1
      - name: Publish individual mirror artifacts
        if: steps.release.outputs.published != 'true'
        run: gh release upload "${{ steps.release.outputs.tag }}" mirror-assets/* --clobber --repo "$GITHUB_REPOSITORY"
      - name: Verify anonymous manifest
        if: steps.release.outputs.published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/dtos-live-inspection-current.json" \
            --output current.json
          python -c "import json; value=json.load(open('current.json')); assert value['status']=='complete'"
          python -m tools.inspection.verify_mirror
