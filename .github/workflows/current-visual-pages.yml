name: Rolling Current Visual Pages

on:
  release:
    types: [published]
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: current-visual-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install static verifier dependency
        run: python -m pip install "Pillow>=11,<13"
      - name: Wait for exact production visual and build current-only site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          for attempt in $(seq 1 60); do
            rm -rf _site/current-visual
            if python -m tools.inspection.pages_visual build --output _site/current-visual; then
              cp -R transport-probe _site/fetch-probe
              printf '%s\n' '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="index,follow"><title>DTOS Visual Review</title></head><body><a href="current-visual/">DTOS Current Visual Mirror</a></body></html>' > _site/index.html
              printf '%s\n' 'User-agent: *' 'Allow: /dtos/current-visual/' 'Allow: /dtos/fetch-probe/' "Sitemap: https://richarddavis47.github.io/dtos/sitemap.xml" > _site/robots.txt
              printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>https://richarddavis47.github.io/dtos/current-visual/</loc></url><url><loc>https://richarddavis47.github.io/dtos/fetch-probe/</loc></url></urlset>' > _site/sitemap.xml
              break
            fi
            if [[ "$attempt" == 60 ]]; then exit 1; fi
            sleep 30
          done
      - uses: actions/configure-pages@v5
      - name: Upload one-day Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1
      - name: Deploy current site atomically
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public HTML, JSON, PNG, identity, and hashes
        run: python -m tools.inspection.pages_visual verify
