name: Validation tooling
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build focused validation dependencies
        run: |
          mkdir /tmp/focused-build
          cp requirements*.txt /tmp/focused-build/
          cat > /tmp/focused-build/Dockerfile <<'DOCKER'
          FROM python:3.12-slim
          COPY requirements*.txt /tmp/
          RUN pip install -r /tmp/requirements-validation.txt
          DOCKER
          docker build -t dtos-focused /tmp/focused-build
      - name: Healthy execution and actual cleanup in enforced 2 GiB
        run: |
          docker run --rm --memory=2g --memory-swap=2g --cpus=2 --network=none -e PYTHONPATH=/src -e PYTHONDONTWRITEBYTECODE=1 -v "$PWD:/src:ro" -w /tmp dtos-focused sh -c 'python -c "from src.platform.lifecycle import memory_snapshot; from src.platform.fois_admission import require_fois_headroom; print(memory_snapshot()); require_fois_headroom()" && python -m unittest tests.test_fois_preparation_cleanup tests.test_fois_navigation_reliability.WorkerTimeoutReliabilityTests tests.test_historical_evidence_weeks tests.test_fois_final_trust tests.test_fois_memory_admission'
  focused-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-validation.txt
      - name: Actual bounded Job execution with inherited child accounting
        run: python -m tools.validation.windows_bounded_unittest tests.test_fois_preparation_cleanup tests.test_fois_navigation_reliability.WorkerTimeoutReliabilityTests tests.test_historical_evidence_weeks tests.test_fois_final_trust tests.test_fois_memory_admission
