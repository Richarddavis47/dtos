name: Linux full DINS memory
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Focused image proof or final full acceptance
        type: choice
        options: [focused-images, focused-team7, full]
        default: focused-images
permissions:
  contents: read
jobs:
  full-dins:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build existing production-shaped image
        run: docker build --file tools/validation/Dockerfile.market-cgroup --tag dtos-dins:validation .
      - name: Full DINS with unchanged memory reserve
        if: inputs.scope == 'full' || inputs.scope == 'focused-team7'
        run: |
          mkdir -p .validation/dins-linux .validation/dins-fixture
          docker run --rm --memory 2g --memory-swap 2g --cpus 2 \
            --add-host dtos.fixture:127.0.0.1 \
            --volume "$PWD/.validation/dins-linux:/output" \
            --volume "$PWD/.validation/dins-fixture:/fixture" \
            --env DTOS_CACHE_FILE=/fixture/dtos_cache.json \
            --env DTOS_HISTORY_DB_FILE=/fixture/dtos_history.sqlite3 \
            --env DTOS_VALIDATION_LEGACY_ARCHIVE_FILE=/fixture/retirement-rehearsal.sqlite3 \
            --env DTOS_METADATA_DB_FILE=/fixture/dtos_metadata.sqlite3 \
            --env DTOS_HISTORY_STORAGE_ROOT=/fixture \
            --env DTOS_PRODUCTION_SHAPED_FIXTURE=1 \
            --env DTOS_BACKGROUND_START_DELAY=0 \
            --env DTOS_PUBLIC_URL=http://dtos.fixture:8767 \
            --env DTOS_DINS_DIAGNOSTIC_PAGE=${{ inputs.scope == 'focused-team7' && 'teams-7' || '' }} \
            --env SLEEPER_LEAGUE_ID=1804000000000000000 \
            dtos-dins:validation \
            sh -c 'python -m tools.validation.generate_sanitized_market_fixture && python -m tools.validation.linux_dins_memory_gate'
      - name: Focused fixture image and browser proof
        if: inputs.scope == 'focused-images'
        run: |
          mkdir -p .validation/dins-linux
          docker run --rm --memory 2g --memory-swap 2g --cpus 2 \
            --volume "$PWD/.validation/dins-linux:/output" dtos-dins:validation \
            sh -c 'python -m unittest tests.test_dins_fixture_images tests.test_dins_fixture_inventory tests.test_linux_dins_memory > /output/fixture-images.log 2>&1'
      - name: Upload sanitized evidence on every outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-full-dins-memory
          path: |
            .validation/dins-linux/summary.json
            .validation/dins-linux/memory-curve.jsonl
            .validation/dins-linux/page-boundaries.jsonl
            .validation/dins-linux/capture-result.json
            .validation/dins-linux/contract-evidence.json
            .validation/dins-linux/server.log
            .validation/dins-linux/capture.log
            .validation/dins-linux/fixture-images.log
          if-no-files-found: error
          retention-days: 14
