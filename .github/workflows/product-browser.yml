  resident-refresh-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build established bounded validation runtime
        run: docker build -f tools/validation/containers/browser.Dockerfile -t dtos-browser-validation .
      - name: Acquire only pinned public disposable fixtures
        run: |
          set -euo pipefail
          mkdir -p .validation/resident-refresh/inputs .validation/resident-refresh/evidence
          base=https://raw.githubusercontent.com/Richarddavis47/dtos/2fffaf5672202a27e155a4a9bdfeee62c9ff27b7/.task-evidence/cache-string-sharing-2237/synthetic-fixtures
          for name in oneqb.json superflex.json projections.sqlite3; do
            curl --fail --silent --show-error --max-time 120 --output ".validation/resident-refresh/inputs/$name" "$base/$name"
          done
          cd .validation/resident-refresh/inputs
          echo '98d76b8452431ff3e6f961b6bddd9a654f7b6d23129d96cce60e52cbf79cb11b  oneqb.json' | sha256sum --check
          echo '49915270f727cd3eb6a3a792b8531a487d7da96a06c031ee0e5a176887f69c81  superflex.json' | sha256sum --check
          echo '43541f6a3c738d0ebeac0794cdfd7c009bd27f450816919315b824b512a7b708  projections.sqlite3' | sha256sum --check
      - name: Prove real publication, ownership, deferral and recovery under 2 GiB
        env:
          DTOS_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          docker run --rm --init --memory=2g --memory-swap=2g --cpus=2 --network=none -v "$PWD:$PWD:ro" -v "$PWD/.validation/resident-refresh:/proof" -w "$PWD" -e DTOS_EXPECTED_HEAD -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0="$PWD" dtos-browser-validation python -m tools.validation.resident_refresh_ownership --fixtures /proof/inputs --output /proof/evidence 2>&1 | tee .validation/resident-refresh/raw.log
          cd .validation/resident-refresh
          sha256sum evidence/result.json raw.log > SHA256SUMS
      - name: Preserve completed and incomplete ownership evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resident-refresh-ownership-2g
          path: |
            .validation/resident-refresh/evidence
            .validation/resident-refresh/raw.log
            .validation/resident-refresh/SHA256SUMS
          if-no-files-found: error
