name: Product browser journeys

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-browser:
    runs-on: ubuntu-24.04
    # A measured 559s suite plus setup exceeded the previous 600s whole-job budget.
    # Keep tests bounded separately, with room for dependency setup and cleanup.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - name: Install validation-only browser dependencies
        run: |
          python -m pip install -r requirements-validation.txt
          python -m playwright install --with-deps chromium
      - name: Authenticated product, interaction and accessibility contracts
        timeout-minutes: 12
        run: |
          python -m unittest tests.test_standings_positioning tests.test_standings_positioning_browser tests.test_matchup_portraits_browser tests.test_matchups_phone tests.test_matchups_phone_browser tests.test_trade_projection_freshness tests.test_trade_projection_freshness_browser tests.test_trade_preview_scope_browser tests.test_trade_simple_discovery tests.test_trade_simple_browser tests.test_historical_evidence_weeks tests.test_fois_final_trust tests.test_fois_final_trust_browser tests.test_fois_evidence_integrity tests.test_fois_trust_browser tests.test_proposal_tray_browser tests.test_journey_evidence tests.test_journey_corrections_browser tests.test_dossier_status_browser tests.test_phone_visual_corrections_browser tests.test_phone_design_semantics tests.test_phone_design_browser tests.test_trade_calculator tests.test_trade_calculator_browser tests.test_calculator_balance_feedback_browser tests.test_calculator_stale_feedback_browser tests.test_trade_explicit_navigation_browser tests.test_trade_navigation_identity tests.test_trade_navigation_browser tests.test_player_actions tests.test_player_actions_browser tests.test_trade_performance tests.test_trade_construction_performance tests.test_trade_performance_browser tests.test_technical_details_browser tests.test_canonical_asset_facts tests.test_canonical_asset_facts_browser tests.test_product_browser_journey tests.test_matchup_browser_contract tests.test_trade_center_browser tests.test_trade_scout_state_browser tests.test_make_it_cheaper_browser tests.test_trade_center_accessibility tests.test_trade_workspace_browser tests.test_trade_workspace_batch1 tests.test_live_inspection tests.test_browser_fixture_images tests.test_visual_retirement tests.test_trade_decision_experience tests.test_trade_decision_browser tests.test_trade_decision_http_browser tests.test_trade_decision_standings_browser tests.test_batch6_trade_ux

  my-team-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - name: Install validation-only browser dependencies
        run: |
          python -m pip install -r requirements-validation.txt
          python -m playwright install --with-deps chromium
      - name: My Team evidence and authenticated session journeys
        run: python -m unittest tests.test_my_team_intelligence tests.test_my_team_intelligence_browser tests.test_my_team_final tests.test_my_team_final_browser tests.test_legacy_display_integrity tests.test_assessment_context_browser tests.test_dynamic_needs tests.test_dynamic_needs_browser tests.test_roster_diagnostic_admission tests.test_roster_diagnostic_http tests.test_roster_diagnostic_browser tests.test_roster_diagnostic_aging tests.test_roster_diagnostic_aging_browser tests.test_source_evidence_presentation tests.test_source_evidence_browser tests.test_league_gm_diagnostics tests.test_league_gm_diagnostics_browser tests.test_league_gm_integrity tests.test_league_gm_integrity_browser

  projection-display-cross-version:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-validation.txt
      - run: python -m playwright install --with-deps chromium
      - name: Real prior publisher and isolated current reader
        run: python -m tools.validation.projection_display_cross_version --browser

  historical-trade-timeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-validation.txt
      - run: python -m playwright install --with-deps chromium
      - name: Historical evidence, source identity and phone routes
        run: python -m unittest tests.test_trade_timeline tests.test_historical_faab_conflicts tests.test_historical_tracker_phase2 tests.test_historical_tracker_phase2_browser tests.test_history_final_source tests.test_history_final_source_browser tests.test_playoff_participant_integrity tests.test_playoff_participant_browser tests.test_championship_evidence_consistency tests.test_championship_evidence_browser tests.test_trade_timeline_browser.TradeTimelineBrowserTests tests.test_historical_trade_time tests.test_fois_evidence_integrity
      - name: Real prior quote publisher and current reader
        run: python -m tools.validation.trade_quote_cross_version

  beginner-navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - name: Install validation-only browser dependencies
        run: |
          python -m pip install -r requirements-validation.txt
          python -m playwright install --with-deps chromium
      - name: Market pagination, visible roster and scoped fresh-start journeys
        run: python -m unittest tests.test_beginner_market tests.test_beginner_browser tests.test_beginner_final tests.test_beginner_final_browser tests.test_home_trade_news tests.test_home_news_corrections tests.test_home_trade_news_browser tests.test_home_opportunities tests.test_home_opportunities_browser tests.test_home_opportunity_integrity tests.test_home_read_responsiveness
