name: Canonical release recovery

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/canonical-release-recovery.yml']

permissions:
  contents: read

concurrency:
  group: canonical-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=256

jobs:
  canonical-release:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare disposable validation harness
        run: |
          mkdir -p .validation/canonical-build .validation/canonical-release/observer .validation/canonical-fixture
          cp requirements.txt requirements-validation.txt .validation/canonical-build/
          cat > .validation/canonical-release/runner.py <<'PY'
          """Run the unchanged canonical validator in an enforced disposable cgroup."""
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import threading
          import time

          import psutil

          ROOT = Path("/app")
          OUTPUT = Path("/output")
          FIXTURE = Path("/fixture")
          OUTPUT.mkdir(exist_ok=True)
          FIXTURE.mkdir(exist_ok=True)
          os.environ.setdefault("NODE_OPTIONS", "--max-old-space-size=256")
          for key, name in {"CACHE":"cache.json", "PROJECTION_DB":"projections.sqlite3",
                            "METADATA_DB":"metadata.sqlite3", "INTELLIGENCE_CHECKPOINT":"intelligence.sqlite3",
                            "FOIS_DB":"fois.sqlite3", "HISTORY_DB":"retired.sqlite3",
                            "ACCOUNT_DB":"accounts.sqlite3"}.items():
              os.environ["DTOS_" + key + "_FILE"] = str(FIXTURE / name)
          os.environ.update(
              DTOS_DURABLE_HISTORY_REQUIRED="0", SLEEPER_BASE_URL="http://127.0.0.1:9/v1",
              SLEEPER_LEAGUE_ID="1804000000000000000", DTOS_FIXTURE_ROOT="/fixture",
              DTOS_SLEEPER_SEASON_CACHE_ROOT="/fixture/sleeper-season-cache",
              DTOS_HISTORY_STORAGE_ROOT="/fixture", DTOS_ATTRIBUTION_TEST_LOG="/output/tests.jsonl",
              DTOS_PLAIN_ENGLISH_EVIDENCE="/output/plain-browser",
              DTOS_OUTLOOK_EVIDENCE="/output/outlook-browser",
              DTOS_BRIEF_EVIDENCE="/output/home-browser",
              DTOS_TREND_BROWSER_EVIDENCE="/output/market-browser.json",
              DTOS_MANAGER_EVIDENCE="/output/manager-browser",
              DTOS_PERSONAL_AVAILABILITY_EVIDENCE="/output/personal-browser",
              DTOS_PERSONAL_RECOVERY_EVIDENCE="/output/personal-recovery",
              DTOS_FOIS_BROWSER_EVIDENCE="/output/fois-browser.json",
              DTOS_PREPARATION_BROWSER_EVIDENCE="/output/preparation-browser.json",
              PYTHONPATH="/output/observer:/app")
          git_n = int(os.environ.get("GIT_CONFIG_COUNT", "0"))
          os.environ["GIT_CONFIG_COUNT"] = str(git_n + 1)
          os.environ["GIT_CONFIG_KEY_" + str(git_n)] = "safe.directory"
          os.environ["GIT_CONFIG_VALUE_" + str(git_n)] = "/app"
          sys.path.insert(0, str(ROOT))
          from src.platform.lifecycle import memory_snapshot

          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert head == os.environ["DTOS_EXPECTED_HEAD"], "Checkout is not the exact requested candidate."
          assert not subprocess.check_output(["git", "status", "--porcelain"], text=True).strip()
          assert memory_snapshot()["cgroup_limit_bytes"] == 2147483648
          assert shutil.disk_usage(FIXTURE).free > 8 * 1024**3, "Need 8 GiB diagnostic scratch space."
          started = time.time()
          stop = threading.Event()
          parent = psutil.Process()

          def watch():
              with (OUTPUT / "memory.jsonl").open("a", buffering=1) as sink:
                  for _ in range(10000):
                      if stop.wait(.5):
                          break
                      sample_start = time.monotonic()
                      row = dict(time=time.time(), monotonic=sample_start,
                                 memory=memory_snapshot(), processes=[],
                                 fixture_free_bytes=shutil.disk_usage(FIXTURE).free)
                      try:
                          stat = dict(line.split() for line in Path("/sys/fs/cgroup/memory.stat").read_text().splitlines())
                          row.update({k:int(stat[k]) for k in ("anon", "file", "shmem", "inactive_file", "active_file", "kernel") if k in stat})
                          row["kernel_peak"] = int(Path("/sys/fs/cgroup/memory.peak").read_text())
                          processes = [parent, *parent.children(recursive=True)]
                          row["process_samples_truncated"] = len(processes) > 24
                          row["zombies"] = 0
                          for process in processes[:24]:
                              try:
                                  if process.status() == psutil.STATUS_ZOMBIE:
                                      row["zombies"] += 1
                                      continue
                                  info = process.memory_full_info()
                                  row["processes"].append(dict(pid=process.pid, ppid=process.ppid(),
                                      name=process.name(), rss=info.rss, pss=getattr(info, "pss", None),
                                      uss=getattr(info, "uss", None)))
                              except psutil.Error:
                                  pass
                      except (psutil.Error, OSError, ValueError):
                          row["sampling_incomplete"] = True
                      row["sampling_window_ms"] = (time.monotonic() - sample_start) * 1000
                      sink.write(json.dumps(row, separators=(",", ":")) + "\n")

          watcher = threading.Thread(target=watch, daemon=True)
          watcher.start()
          code = 1
          error = None
          try:
              from tools.validation import generate_sanitized_market_fixture as seed
              seed.ASSET_COUNT = 250
              data = seed._cache(FIXTURE / "cache.json")
              seed.seed_fixture_projection(data, FIXTURE / "projections.sqlite3")
              seed._canonical_history_fixture(FIXTURE)
              with (OUTPUT / "canonical.log").open("w") as stream:
                  result = subprocess.run([sys.executable, "-m", "tools.validation.validate_release"],
                                          stdout=stream, stderr=subprocess.STDOUT, timeout=3000)
              code = result.returncode
          except BaseException as exc:
              error = type(exc).__name__ + ": " + str(exc)
              raise
          finally:
              stop.set()
              watcher.join(3)
              trace = ROOT / ".validation" / "validator_trace.jsonl"
              if trace.exists():
                  shutil.copy2(trace, OUTPUT / "canonical-trace.jsonl")
              report = dict(head=head, tree=subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
                  python=sys.version, started_at=started, finished_at=time.time(),
                  elapsed_seconds=time.time()-started, exit_code=code, passed=code == 0,
                  error=error, cgroup_limit=2147483648, cpus=2, network="none",
                  final_memory=memory_snapshot(), kernel_peak=int(Path("/sys/fs/cgroup/memory.peak").read_text()),
                  fixture="250 asset prepared sanitized foundation; disposable authenticated test transports")
              (OUTPUT / "result.json").write_text(json.dumps(report, indent=2))
              print(json.dumps(report), flush=True)
              manifest = []
              for path in sorted(OUTPUT.rglob("*")):
                  if path.is_file() and path.name not in {"manifest.json", "SHA256SUMS"}:
                      manifest.append(dict(name=str(path.relative_to(OUTPUT)), bytes=path.stat().st_size,
                                           sha256=hashlib.sha256(path.read_bytes()).hexdigest()))
              (OUTPUT / "manifest.json").write_text(json.dumps(manifest, indent=2))
              (OUTPUT / "SHA256SUMS").write_text("".join(item["sha256"] + "  " + item["name"] + "\n" for item in manifest))
              tail = (OUTPUT / "canonical.log")
              if tail.exists():
                  print(tail.read_text(errors="replace")[-12000:], flush=True)
          raise SystemExit(code)
          PY
          cat > .validation/canonical-release/observer/sitecustomize.py <<'PY'
          """Read-only per-test timings and console capture for isolated release validation."""
          import json
          import os
          from pathlib import Path
          import sys
          import threading
          import time
          import unittest

          if os.environ.get("DTOS_ATTRIBUTION_TEST_LOG") and "discover" in sys.argv:
              _console = open("/output/unittest-console.log", "a", buffering=1)
              _lock = threading.RLock()

              class _Tee:
                  def __init__(self, original):
                      self.original = original

                  def write(self, value):
                      with _lock:
                          _console.write(value)
                          _console.flush()
                      return self.original.write(value)

                  def flush(self):
                      _console.flush()
                      return self.original.flush()

                  def __getattr__(self, name):
                      return getattr(self.original, name)

              sys.stdout = _Tee(sys.stdout)
              sys.stderr = _Tee(sys.stderr)

              def record(event, test, error=None):
                  pages = Path("/proc/self/statm").read_text().split()
                  row = dict(event=event, test=test.id(), time=time.time(), pid=os.getpid(),
                             rss=int(pages[1]) * os.sysconf("SC_PAGE_SIZE"),
                             cgroup=int(Path("/sys/fs/cgroup/memory.current").read_text()))
                  if error:
                      row["error_type"] = error[0].__name__ if isinstance(error, tuple) else "skip"
                      row["error_text"] = str(error[1])[:2000] if isinstance(error, tuple) else str(error)
                  with open(os.environ["DTOS_ATTRIBUTION_TEST_LOG"], "a") as stream:
                      stream.write(json.dumps(row) + "\n")

              for name, event in [("startTest", "start"), ("stopTest", "stop"),
                                  ("addError", "error"), ("addFailure", "failure"),
                                  ("addSkip", "skip")]:
                  original = getattr(unittest.TestResult, name)

                  def observed(self, test, *args, _original=original, _event=event):
                      record(_event, test, args[0] if args else None)
                      return _original(self, test, *args)

                  setattr(unittest.TestResult, name, observed)
          PY
      - name: Build production Python and browser validation image
        timeout-minutes: 10
        run: |
          set -euo pipefail
          docker pull python:3.14.3-slim-bookworm
          image_ref="$(docker image inspect python:3.14.3-slim-bookworm --format '{{index .RepoDigests 0}}')"
          echo "Resolved Python image: $image_ref"
          printf 'FROM %s\n' "$image_ref" > .validation/canonical-build/Dockerfile
          cat >> .validation/canonical-build/Dockerfile <<'DOCKER'
          ENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1 PIP_DISABLE_PIP_VERSION_CHECK=1 DTOS_CHROMIUM_EXECUTABLE=/usr/bin/chromium
          RUN apt-get update && apt-get install -y --no-install-recommends chromium git && rm -rf /var/lib/apt/lists/*
          COPY requirements.txt requirements-validation.txt /build/
          RUN python -m pip install --no-cache-dir -r /build/requirements-validation.txt
          WORKDIR /app
          DOCKER
          docker build --file .validation/canonical-build/Dockerfile --tag dtos-canonical-release:validation .validation/canonical-build 2>&1 | tee .validation/canonical-release/image-build.log
          docker run --rm dtos-canonical-release:validation sh -c 'python --version && chromium --version && python -m pip check' | tee .validation/canonical-release/environment.txt
      - name: Run unchanged ten-gate validator under actual 2 GiB
        timeout-minutes: 52
        env:
          DTOS_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docker run --name dtos-canonical-release --init --memory 2g --memory-swap 2g --cpus 2 --network none \
            --volume "$PWD:/app" \
            --volume "$PWD/.validation/canonical-release:/output" \
            --volume "$PWD/.validation/canonical-fixture:/fixture" \
            --env DTOS_EXPECTED_HEAD="$DTOS_EXPECTED_HEAD" \
            --workdir /app dtos-canonical-release:validation python /output/runner.py
      - name: Preserve container outcome
        if: always()
        run: |
          if docker inspect dtos-canonical-release >/dev/null 2>&1; then
            docker inspect --format '{{json .State}}' dtos-canonical-release > .validation/canonical-release/container-state.json
            docker logs dtos-canonical-release > .validation/canonical-release/container.log 2>&1
          fi
      - name: Upload source-pinned raw validation and phone evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-release-2g-python314
          path: .validation/canonical-release/
          if-no-files-found: error
          retention-days: 14
      - name: Retire owned container
        if: always()
        run: |
          if docker inspect dtos-canonical-release >/dev/null 2>&1; then docker rm -f dtos-canonical-release; fi

  publish-2191:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'v1.21.91')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      checks: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require exact validated tree and existing immutable-release policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .validation/release-2191
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          from app_metadata import VERSION, BUILD_NUMBER

          repo = "Richarddavis47/dtos"
          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", path], text=True))
          assert VERSION == "1.21.91" and BUILD_NUMBER == 2191
          sha = os.environ["GITHUB_SHA"]
          associated = api("repos/" + repo + "/commits/" + sha + "/pulls")
          merged = [item for item in associated if item.get("merged_at") and item.get("merge_commit_sha") == sha]
          assert len(merged) == 1, "Expected one fully merged source PR."
          pr = api("repos/" + repo + "/pulls/" + str(merged[0]["number"]))
          assert pr["merged"] and pr["merge_commit_sha"] == sha
          assert pr["head"]["repo"]["full_name"] == repo and pr["head"]["ref"].startswith("fix/v1.21.91-")
          head = pr["head"]["sha"]
          checks = api("repos/" + repo + "/commits/" + head + "/check-runs?per_page=100&filter=latest")
          required = {"product-browser", "my-team-browser", "beginner-navigation",
                      "historical-trade-timeline", "projection-display-cross-version",
                      "tooling (ubuntu-24.04)", "tooling (windows-latest)",
                      "cgroup-lifecycle (ordinary)", "cgroup-lifecycle (archive-warmed)",
                      "cgroup-lifecycle (combined-read)", "canonical-release"}
          states = {row["name"]:row["conclusion"] for row in checks["check_runs"]}
          assert all(states.get(name) == "success" for name in required), states
          setting = api("repos/" + repo + "/releases/tags/v1.21.90")
          assert setting.get("immutable") is True, "The accepted prior release must be immutable."
          subprocess.run(["git", "fetch", "origin", "refs/pull/" + str(pr["number"]) + "/head"], check=True)
          assert subprocess.check_output(["git", "rev-parse", "FETCH_HEAD"], text=True).strip() == head
          subprocess.run(["git", "diff", "--exit-code", "HEAD^{tree}", "FETCH_HEAD^{tree}"], check=True)
          notes = Path("RELEASE_NOTES.md").read_text().split("\n## ", 1)[0]
          Path(".validation/release-2191/notes.md").write_text(notes)
          Path(".validation/release-2191/admission.json").write_text(json.dumps(
              dict(merge_commit=sha, validated_head=head, pr_number=pr["number"], source_branch=pr["head"]["ref"], required_checks=states, prior_immutable_release=dict(tag=setting["tag_name"], immutable=setting["immutable"])), indent=2))
          PY
      - name: Collect verified raw evidence and individual phone images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import time
          import zipfile
          from collections import Counter

          root = Path(".validation/release-2191")
          evidence = root / "evidence"
          assets = root / "assets"
          evidence.mkdir(exist_ok=True)
          assets.mkdir(exist_ok=True)
          admission = json.loads((root / "admission.json").read_text())
          head = admission["validated_head"]
          repo = "Richarddavis47/dtos"
          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", path], text=True))
          runs = api("repos/" + repo + "/actions/runs?head_sha=" + head + "&event=pull_request&per_page=100")["workflow_runs"]
          def successful(name):
              return max((r for r in runs if r["name"] == name and r["conclusion"] == "success"), key=lambda r:r["id"])
          canonical_run = successful("Canonical release recovery")["id"]
          lifecycle_run = successful("Linux Asset Market lifecycle")["id"]
          subprocess.run(["gh", "run", "download", str(canonical_run), "--name",
                          "canonical-release-2g-python314", "--dir", str(evidence / "canonical")], check=True)
          for scenario in ("ordinary", "archive-warmed", "combined-read"):
              subprocess.run(["gh", "run", "download", str(lifecycle_run), "--name",
                  "linux-market-lifecycle-" + scenario + "-summary",
                  "--dir", str(evidence / scenario)], check=True)
          canonical = json.loads((evidence / "canonical/result.json").read_text())
          assert canonical["head"] == head and canonical["passed"] is True
          for item in json.loads((evidence / "canonical/manifest.json").read_text()):
              path = evidence / "canonical" / item["name"]
              assert path.stat().st_size == item["bytes"]
              assert hashlib.sha256(path.read_bytes()).hexdigest() == item["sha256"]
          failures = evidence / "prior-failed-jobs"
          failures.mkdir()
          for job in (120789448802, 120789448890, 120790968882, 120792421041, 120796026274, 120805029770):
              with (failures / (str(job) + ".log")).open("wb") as output:
                  subprocess.run(["gh", "api", "--allow-escape-sequences", "repos/" + repo + "/actions/jobs/" + str(job) + "/logs"],
                                 stdout=output, check=True)
          events = [json.loads(line) for line in (evidence / "canonical/tests.jsonl").read_text().splitlines()]
          samples = [json.loads(line) for line in (evidence / "canonical/memory.jsonl").read_text().splitlines()]
          lifecycle = {name:json.loads((evidence / name / "summary.json").read_text())
                       for name in ("ordinary", "archive-warmed", "combined-read")}
          geometry = {str(path.relative_to(evidence)):json.loads(path.read_text())
              for path in (evidence / "canonical/plain-browser").glob("*.json")}
          summary = dict(merge_commit=os.environ["GITHUB_SHA"], validated_head=head, canonical=canonical,
              test_events=dict(Counter(row["event"] for row in events)),
              measured_peak_cgroup=max(row["memory"]["cgroup_current_bytes"] for row in samples),
              measured_peak_anon=max(row.get("anon",0) for row in samples),
              measured_peak_file=max(row.get("file",0) for row in samples),
              sampling="0.5s bounded process/cgroup samples; individual PSS reads are not summed as simultaneous totals",
              lifecycle=lifecycle, geometry=geometry,
              limitations="Author fixtures, not independent Scout/human/physical Safari acceptance. Original lost-workspace artifacts remain unavailable; prior hosted failures are preserved.")
          (root / "VALIDATION.json").write_text(json.dumps(summary, indent=2))
          print("DTOS_EVIDENCE_SUMMARY " + json.dumps(summary, separators=(",", ":")))
          for path in (evidence / "canonical/plain-browser").glob("*.png"):
              shutil.copy2(path, assets / ("plain-" + path.name))
          for path in (evidence / "canonical/home-browser").glob("home-*.png"):
              shutil.copy2(path, assets / ("brief-" + path.name))
          inventory = []
          for path in sorted(evidence.rglob("*")):
              if path.is_file():
                  inventory.append(dict(name=str(path.relative_to(root)), bytes=path.stat().st_size,
                                        sha256=hashlib.sha256(path.read_bytes()).hexdigest()))
          inventory.append(dict(name="VALIDATION.json", bytes=(root/"VALIDATION.json").stat().st_size,
                                sha256=hashlib.sha256((root/"VALIDATION.json").read_bytes()).hexdigest()))
          (root / "evidence-manifest.json").write_text(json.dumps(dict(
              merge_commit=os.environ["GITHUB_SHA"], validated_head=head, packaged_at=time.time(), files=inventory), indent=2))
          (root / "SHA256SUMS").write_text("".join(row["sha256"] + "  " + row["name"] + "\n" for row in inventory))
          assert sum(row["bytes"] for row in inventory) < 512 * 1024**2, "Unexpectedly large evidence; nothing truncated."
          archive = assets / "DTOS-v1.21.91-evidence.zip"
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED, compresslevel=6) as bundle:
              for row in inventory:
                  bundle.write(root / row["name"], row["name"])
              for name in ("evidence-manifest.json", "SHA256SUMS", "admission.json", "notes.md"):
                  bundle.write(root / name, name)
          with zipfile.ZipFile(archive) as bundle:
              assert bundle.testzip() is None
          for name in ("VALIDATION.json", "evidence-manifest.json", "SHA256SUMS"):
              shutil.copy2(root / name, assets / name)
          (root / "package.json").write_text(json.dumps(dict(name=archive.name, bytes=archive.stat().st_size,
              sha256=hashlib.sha256(archive.read_bytes()).hexdigest(), source=head), indent=2))
          print("DTOS_PACKAGE " + (root/"package.json").read_text())
          PY
      - name: Publish normal annotated tag and immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git show-ref --verify --quiet refs/tags/v1.21.91; then
            test "$(git rev-parse 'v1.21.91^{commit}')" = "$GITHUB_SHA"
          else
            git tag -a v1.21.91 "$GITHUB_SHA" -m 'DTOS v1.21.91 / build 2191 — Plain-English Decision Experience'
            git push origin refs/tags/v1.21.91
          fi
          if ! gh release view v1.21.91 --json tagName,isDraft > .validation/release-2191/existing-release.json 2> .validation/release-2191/release-lookup.log; then
            gh release create v1.21.91 --draft --verify-tag --target "$GITHUB_SHA" --title 'DTOS v1.21.91 / build 2191' --notes-file .validation/release-2191/notes.md
          fi
          if gh release view v1.21.91 --json isDraft --jq .isDraft | grep -q true; then
            gh release upload v1.21.91 .validation/release-2191/assets/* --clobber
            gh release edit v1.21.91 --draft=false
          fi
          gh api repos/Richarddavis47/dtos/releases/tags/v1.21.91 --jq '{id,tag_name,target_commitish,immutable,draft,published_at,html_url,assets:[.assets[]|{name,size,digest,browser_download_url}]}' > .validation/release-2191/release.json
          cat .validation/release-2191/release.json
          python -c "import json; p=json.load(open('.validation/release-2191/release.json')); assert p['immutable'] is True and p['draft'] is False"
      - name: Verify normal Render rollout and bounded read-only live smoke
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          origin = "https://dtos.onrender.com"
          sha = os.environ["GITHUB_SHA"]
          root = Path(".validation/release-2191")
          attempts = []
          ready = None
          for _ in range(60):
              began = time.monotonic()
              try:
                  with urlopen(Request(origin + "/health/ready", headers={"Cache-Control":"no-cache"}), timeout=10) as response:
                      data = json.load(response)
                  public = {key:data.get(key) for key in ("status", "version", "build", "deployment", "reason")}
                  attempts.append(dict(time=time.time(), elapsed_seconds=time.monotonic()-began, **public))
                  (root / "readiness-attempts.json").write_text(json.dumps(attempts, indent=2))
                  if data.get("status") == "ready" and data.get("version") == "1.21.91" and data.get("build") == 2191 and data.get("deployment", {}).get("commit") == sha:
                      ready = public
                      break
              except (HTTPError, URLError, TimeoutError) as exc:
                  attempts.append(dict(time=time.time(), error=type(exc).__name__))
                  (root / "readiness-attempts.json").write_text(json.dumps(attempts, indent=2))
              time.sleep(10)
          assert ready is not None, "Exact release did not become ready in the bounded observation window."
          results = []
          for path, expected in [("/health/live",200), ("/account/sign-in",200), ("/api/my-dtos",401),
                                  ("/static/js/personal_rankings.js",200), ("/static/js/trade_workspace.js",200)]:
              began = time.monotonic()
              try:
                  with urlopen(origin+path, timeout=15) as response:
                      code, body = response.status, response.read()
              except HTTPError as exc:
                  code, body = exc.code, exc.read()
              assert code == expected, (path, code)
              item = dict(path=path, status=code, elapsed_seconds=time.monotonic()-began)
              if path.startswith("/static/"):
                  item["sha256"] = hashlib.sha256(body).hexdigest()
                  assert body == Path(path.lstrip("/")).read_bytes(), "Static bytes differ from released source."
              results.append(item)
          (root / "production-smoke.json").write_text(json.dumps(dict(readiness=ready, reads=results,
              scope="Bounded unauthenticated read-only smoke; authenticated fixture/browser evidence is separate."), indent=2))
          print(json.dumps(dict(version=ready["version"],build=ready["build"],commit=sha,readiness="ready",smoke="passed")))
          PY
      - name: Remove only the unchanged fully merged source branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          root = Path(".validation/release-2191")
          admission = json.loads((root / "admission.json").read_text())
          sources = [(admission["source_branch"], admission["validated_head"]),
                     ("fix/v1.21.91-plain-english", "ab2453989d4de2eb231ef01d1fe90c819c4bd175")]
          states = []
          for branch, head in dict(sources).items():
              assert branch.startswith("fix/v1.21.91-")
              path = "repos/Richarddavis47/dtos/git/refs/heads/" + branch
              result = subprocess.run(["gh", "api", path], capture_output=True, text=True)
              if result.returncode:
                  assert "HTTP 404" in result.stderr or '"status":"404"' in result.stdout.replace(" ", ""), result.stderr
                  state = {"already_absent":True}
              else:
                  assert json.loads(result.stdout)["object"]["sha"] == head, "Source branch advanced; preserve it."
                  subprocess.run(["gh", "api", "--method", "DELETE", path], check=True)
                  state = {"deleted_merged_branch":True}
              states.append({"branch":branch, "validated_head":head, **state})
          (root / "branch-cleanup.json").write_text(json.dumps(states, indent=2))
          PY
      - name: Upload immutable release and production verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-2191-production-verification
          path: |
            .validation/release-2191/admission.json
            .validation/release-2191/release-lookup.log
            .validation/release-2191/release.json
            .validation/release-2191/production-smoke.json
            .validation/release-2191/readiness-attempts.json
            .validation/release-2191/package.json
            .validation/release-2191/branch-cleanup.json
            .validation/release-2191/VALIDATION.json
            .validation/release-2191/evidence-manifest.json
            .validation/release-2191/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
